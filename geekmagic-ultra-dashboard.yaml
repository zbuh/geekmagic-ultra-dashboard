#SOME OF THIS IS MY OWN WORK OR TAKEN FROM HA COMMUNITY FORUMS BUT MUCH WAS GENERATED BY AI. USE AT OWN RISK.
#
#CREATE NEW DEVICE IN ESPHOME DASHBOARD AND SELECT EMPTY CONFIGURATION, THEN DOWNLOAD .BIN WHEN COMPILED
#FLASH MINIMUM CONFIG .BIN FW (ONLY LINES ESPHOME TO API) VIA THE OTA OPTION ON THE SMALLTV WEB UI STOCK FW TO GET
#THE DEVICE INTO ESPHOME, THEN CHANGE LOG LEVEL TO ERROR AND ADD THE REST.
#
#HOW THIS PROJECT IS CONFIGURED (read this before flashing):
# 1. Edit the "substitutions" block below with your own HA entity IDs, units and icons. This is
#    the only part you need to touch to wire up your own sensors - the rest of the file is
#    generic. You need to reflash after changing a substitution.
# 2. Everything else (rotation speed, burn-in pixel shift, which pages are active) shows up as
#    normal entities on the ESPHome device in Home Assistant and can be changed live, no reflash
#    needed: a "Display Rotation Interval" number, a "Display Pixel Shift" switch, and one
#    "Display Page ..." switch per page.
# 3. Icons are pasted as raw glyph characters from the Material Symbols Outlined picker
#    (https://fonts.google.com/icons -> pick a style "Outlined" icon -> copy the glyph). Paste
#    the glyph itself into the substitution value between the quotes. Leaving an icon substitution
#    empty leaves that slot/condition blank - it's simply skipped when drawing.

substitutions:
    # --- Weather (used on the main page: condition icon + description + temperature) ---
    weather_entity_id: "weather.home"

    # Icon glyph shown for each possible HA weather condition. See the "conditions" list at
    # https://www.home-assistant.io/integrations/weather/ - paste a Material Symbols glyph for
    # each one you care about, leave the rest empty if you don't mind a blank icon for them.
    # The glyph characters below are invisible in most editors/terminals (Material Symbols
    # glyphs live in the Unicode Private Use Area) - the comment names what each one is.
    weather_icon_sunny: "" # sunny
    weather_icon_clear_night: "" # clear_night
    weather_icon_partlycloudy: "" # partly_cloudy_day
    weather_icon_cloudy: "" # cloud
    weather_icon_fog: "" # foggy
    weather_icon_rainy: "" # rainy
    weather_icon_pouring: "" # rainy_heavy
    weather_icon_lightning: "" # thunderstorm
    weather_icon_lightning_rainy: "" # storm
    weather_icon_hail: "" # weather_hail
    weather_icon_snowy: "" # weather_snowy
    weather_icon_snowy_rainy: "" # weather_mix
    weather_icon_windy: "" # air
    weather_icon_windy_variant: "" # cyclone
    weather_icon_exceptional: "" # warning

    # Short description shown under the icon on the main page - translate these to your own
    # language, they're plain display text with no effect on anything else.
    weather_text_sunny: "Sunny"
    weather_text_clear_night: "Clear night"
    weather_text_partlycloudy: "Partly cloudy"
    weather_text_cloudy: "Cloudy"
    weather_text_fog: "Foggy"
    weather_text_rainy: "Rainy"
    weather_text_pouring: "Heavy rain"
    weather_text_lightning: "Thunderstorm"
    weather_text_lightning_rainy: "Thunderstorm & rain"
    weather_text_hail: "Hail"
    weather_text_snowy: "Snowy"
    weather_text_snowy_rainy: "Snow & rain"
    weather_text_windy: "Windy"
    weather_text_windy_variant: "Windy"
    weather_text_exceptional: "Alert"

    # --- Generic pages: 2 pages, up to 4 entries each (2x2 grid: top-left, top-right,
    # bottom-left, bottom-right). Each entry is an icon + a primary value + a secondary value.
    # For "primary"/"secondary": set the *_entity to a numeric HA sensor to show its live value
    # (formatted/scaled using *_unit), or leave *_entity as "sensor.none" (a placeholder that will
    # never exist, so it never reports a value) and set *_label to a fixed piece of text instead.
    # Leave icon empty to leave that slot blank (this is how you use fewer than 4 entries on a
    # page). entity_id must always look like "domain.something" - ESPHome rejects a blank string.

    # --- Page 1: Solar & Battery (filled in with real sensors from this home as a working example) ---
    # Entry 1 (top-left): solar power now + today's solar production.
    page1_entry1_icon: ""
    page1_entry1_primary_entity: "sensor.arrumos_inverter_input_power_with_efficiency_loss"
    page1_entry1_primary_unit: "W"
    page1_entry1_primary_label: ""
    page1_entry1_secondary_entity: "sensor.arrumos_inverter_solar_production_daily"
    page1_entry1_secondary_unit: "kWh"
    page1_entry1_secondary_label: ""

    # Entry 2 (top-right): battery state of charge + charge/discharge power.
    page1_entry2_icon: ""
    page1_entry2_primary_entity: "sensor.arrumos_batteries_state_of_capacity"
    page1_entry2_primary_unit: "%"
    page1_entry2_primary_label: ""
    page1_entry2_secondary_entity: "sensor.arrumos_batteries_charge_discharge_power"
    page1_entry2_secondary_unit: "W"
    page1_entry2_secondary_label: ""

    # Entry 3 (bottom-left): grid power now + today's grid energy.
    page1_entry3_icon: ""
    page1_entry3_primary_entity: "sensor.rede_power"
    page1_entry3_primary_unit: "W"
    page1_entry3_primary_label: ""
    page1_entry3_secondary_entity: "sensor.energia_diaria"
    page1_entry3_secondary_unit: "kWh"
    page1_entry3_secondary_label: ""

    # Entry 4 (bottom-right): wallbox status + current
    page1_entry4_icon: ""
    page1_entry4_primary_entity: "sensor.power_meter_zb_01_current_b"
    page1_entry4_primary_unit: "A"
    page1_entry4_primary_label: ""
    page1_entry4_secondary_entity: "sensor.wallbox_energy_session"
    page1_entry4_secondary_unit: "kWh"
    page1_entry4_secondary_label: ""

    # --- Page 2: Solar Forecast (Solcast) - entry 4 intentionally left blank/unused, to show
    # that a page doesn't have to fill all 4 slots. ---
    # Entry 1 (top-left): total solar forecast for today + how much of that is still to come.
    page2_entry1_icon: ""
    page2_entry1_primary_entity: "sensor.solcast_pv_forecast_forecast_today"
    page2_entry1_primary_unit: ""
    page2_entry1_primary_label: ""
    page2_entry1_secondary_entity: "sensor.solcast_pv_forecast_forecast_remaining_today"
    page2_entry1_secondary_unit: ""
    page2_entry1_secondary_label: ""

    page2_entry2_icon: ""
    page2_entry2_primary_entity: "sensor.solcast_pv_forecast_forecast_tomorrow"
    page2_entry2_primary_unit: ""
    page2_entry2_primary_label: "" # Entry 2: tomorrow's forecast, "Tomorrow" as a static secondary label
    page2_entry2_secondary_entity: "sensor.none"
    page2_entry2_secondary_unit: ""
    page2_entry2_secondary_label: "Tomorrow"

    page2_entry3_icon: ""
    page2_entry3_primary_entity: "sensor.solcast_pv_forecast_forecast_day_3" # Entry 3: forecast 3 days
    page2_entry3_primary_unit: ""
    page2_entry3_primary_label: ""
    page2_entry3_secondary_entity: "sensor.none"
    page2_entry3_secondary_unit: ""
    page2_entry3_secondary_label: "3 days"

    page2_entry4_icon: ""
    page2_entry4_primary_entity: "sensor.solcast_pv_forecast_forecast_day_4" # Entry 4: forecast 4 days
    page2_entry4_primary_unit: ""
    page2_entry4_primary_label: ""
    page2_entry4_secondary_entity: "sensor.none"
    page2_entry4_secondary_unit: ""
    page2_entry4_secondary_label: "4 days"

    # --- Alarm page (alarm_control_panel entity) ---
    alarm_entity_id: "alarm_control_panel.alarmo"
    # Base icon per state family - used as the default below for every state in that family.
    # Color already distinguishes the individual states too (see the page_alarm lambda below).
    alarm_icon_disarmed: "" # lock_open
    alarm_icon_armed: "" # shield_lock (used for armed_home/away/night/vacation/custom_bypass)
    alarm_icon_pending: "" # hourglass_top (used for pending/arming/disarming)
    alarm_icon_triggered: "" # gpp_bad

    # One icon per exact state, each defaulting to its family icon above - the full state list
    # is fixed by the alarm_control_panel domain, so override any of these individually if you
    # want a more granular look (e.g. a distinct icon for armed_night vs armed_away) instead of
    # sharing one icon per family.
    alarm_icon_armed_home: "${alarm_icon_armed}"
    alarm_icon_armed_away: "${alarm_icon_armed}"
    alarm_icon_armed_night: "${alarm_icon_armed}"
    alarm_icon_armed_vacation: "${alarm_icon_armed}"
    alarm_icon_armed_bypass: "${alarm_icon_armed}"
    alarm_icon_arming: "${alarm_icon_pending}"
    alarm_icon_disarming: "${alarm_icon_pending}"

    # Display text per state - translate these to your own language.
    alarm_text_disarmed: "Disarmed"
    alarm_text_armed_home: "Armed Home"
    alarm_text_armed_away: "Armed Away"
    alarm_text_armed_night: "Armed Night"
    alarm_text_armed_vacation: "Armed Vacation"
    alarm_text_armed_bypass: "Armed Bypass"
    alarm_text_pending: "Pending"
    alarm_text_arming: "Arming..."
    alarm_text_disarming: "Disarming..."
    alarm_text_triggered: "TRIGGERED"
    alarm_text_cause_prefix: "Cause: "
    alarm_text_cause_unknown: "Unknown cause"

    # --- Lights page (a HA sensor that counts lights currently on) ---
    # Point this at a template sensor whose state is the number of lights on and whose
    # "entity_name" attribute is the list of their friendly names - e.g. this home's
    # sensor.info_lights_on. If you don't have one, HA's "Group" helper (light domain) plus a
    # template sensor built from its members' states works too.
    lights_entity_id: "sensor.info_lights_on"
    lights_icon_on: "" # lightbulb
    lights_icon_off: "" # light_off

    # Display text - translate these to your own language.
    lights_text_all_off: "All lights off"
    lights_text_one_on: "1 light on"
    lights_text_on_suffix: "lights on" # built as "<n> <suffix>", e.g. "3 lights on"

esphome:
    name: geekmagic-ultra-dashboard
    includes:
        - display_helpers.h

esp8266:
    board: esp12e

wifi:
    fast_connect: true
    networks:
        - ssid: !secret wifi_ssid
          password: !secret wifi_password

# ABSOLUTELY CRITICAL: Disable the logger to free up RAM
logger:
    level: NONE

api:

globals:
    - id: offset_x
      type: int
      restore_value: no
      initial_value: "0"
    - id: offset_y
      type: int
      restore_value: no
      initial_value: "0"
    - id: rotation_elapsed
      type: int
      restore_value: no
      initial_value: "0"
    # --- Alarm page: tracks the last observed state transition (previous state's name is
    # otherwise lost as soon as the new state arrives) so the page can show "Anterior -> Atual". ---
    - id: alarm_initialized
      type: bool
      restore_value: no
      initial_value: "false"
    - id: alarm_last_raw_state
      type: std::string
      restore_value: no
      initial_value: '""'
    - id: alarm_prev_name
      type: std::string
      restore_value: no
      initial_value: '""'
    - id: alarm_transition_time
      type: std::string
      restore_value: no
      initial_value: '""'

ota:
    - platform: esphome

spi:
    clk_pin: GPIO14
    mosi_pin: GPIO13

output:
    - platform: esp8266_pwm
      pin: GPIO05
      frequency: 1000 Hz
      id: pwm_backlight
      inverted: true

light:
    - platform: monochromatic
      output: pwm_backlight
      name: "SmallTV Backlight"
      id: backlight_panel
      restore_mode: RESTORE_DEFAULT_ON

# Simple on/off tile for HA - wraps the backlight light above (which is already exposed to
# HA on its own and also supports brightness, if you'd rather use that entity directly).
switch:
    - platform: template
      name: "SmallTV Display"
      id: display_switch
      icon: "mdi:monitor"
      lambda: |-
          return id(backlight_panel).remote_values.is_on();
      turn_on_action:
          - light.turn_on: backlight_panel
      turn_off_action:
          - light.turn_off: backlight_panel

    # --- Live configuration, exposed as normal HA entities (no reflash needed) ---
    - platform: template
      name: "Display Pixel Shift"
      id: pixel_shift_enable
      icon: "mdi:blur"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
    - platform: template
      name: "Display Page Main"
      id: page_main_enable
      icon: "mdi:page-layout-header"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
    - platform: template
      name: "Display Page 1"
      id: page1_enable
      icon: "mdi:numeric-1-box-outline"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
    - platform: template
      name: "Display Page 2"
      id: page2_enable
      icon: "mdi:numeric-2-box-outline"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
    - platform: template
      name: "Display Page Alarm"
      id: page_alarm_enable
      icon: "mdi:shield-lock-outline"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
    - platform: template
      name: "Display Page Lights"
      id: page_lights_enable
      icon: "mdi:lightbulb-group-outline"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON

number:
    - platform: template
      name: "Display Rotation Interval"
      id: rotation_interval
      icon: "mdi:timer-outline"
      unit_of_measurement: "s"
      min_value: 3
      max_value: 60
      step: 1
      initial_value: 10
      mode: box
      optimistic: true
      restore_value: true

display:
    - platform: mipi_spi
      model: ST7789V
      dc_pin: GPIO00
      reset_pin: GPIO02
      dimensions:
          width: 240
          height: 240
      color_depth: 8bit
      spi_mode: mode3
      invert_colors: true
      update_interval: never
      id: disp
      pages:
          # --- PAGE MAIN: clock + date + today's weather forecast ---
          - id: page_main
            lambda: |-
                it.fill(Color(0, 0, 0));

                int ox = id(offset_x);
                int oy = id(offset_y);

                it.strftime(120 + ox, 4 + oy, id(clock_font_large), Color(0, 220, 255), TextAlign::TOP_CENTER, "%H:%M", id(sntp_time).now());
                it.strftime(120 + ox, 54 + oy, id(main_font), Color(150, 150, 150), TextAlign::TOP_CENTER, "%a, %d %b", id(sntp_time).now());

                it.line(10 + ox, 80 + oy, 230 + ox, 80 + oy, Color(50, 50, 50));

                // Default = sunny; only the other conditions need to be matched below.
                std::string cond = id(weather_condition).state;
                const char *wicon = "${weather_icon_sunny}";
                std::string wdesc = "${weather_text_sunny}";
                Color wcolor = Color(255, 196, 0);

                if (cond == "clear-night") { wicon = "${weather_icon_clear_night}"; wdesc = "${weather_text_clear_night}"; wcolor = Color(120, 140, 220); }
                else if (cond == "partlycloudy") { wicon = "${weather_icon_partlycloudy}"; wdesc = "${weather_text_partlycloudy}"; wcolor = Color(170, 170, 170); }
                else if (cond == "cloudy") { wicon = "${weather_icon_cloudy}"; wdesc = "${weather_text_cloudy}"; wcolor = Color(170, 170, 170); }
                else if (cond == "fog") { wicon = "${weather_icon_fog}"; wdesc = "${weather_text_fog}"; wcolor = Color(170, 170, 170); }
                else if (cond == "rainy") { wicon = "${weather_icon_rainy}"; wdesc = "${weather_text_rainy}"; wcolor = Color(120, 190, 255); }
                else if (cond == "pouring") { wicon = "${weather_icon_pouring}"; wdesc = "${weather_text_pouring}"; wcolor = Color(120, 190, 255); }
                else if (cond == "lightning") { wicon = "${weather_icon_lightning}"; wdesc = "${weather_text_lightning}"; wcolor = Color(230, 80, 80); }
                else if (cond == "lightning-rainy") { wicon = "${weather_icon_lightning_rainy}"; wdesc = "${weather_text_lightning_rainy}"; wcolor = Color(230, 80, 80); }
                else if (cond == "hail") { wicon = "${weather_icon_hail}"; wdesc = "${weather_text_hail}"; wcolor = Color(120, 190, 255); }
                else if (cond == "snowy") { wicon = "${weather_icon_snowy}"; wdesc = "${weather_text_snowy}"; wcolor = Color(220, 220, 255); }
                else if (cond == "snowy-rainy") { wicon = "${weather_icon_snowy_rainy}"; wdesc = "${weather_text_snowy_rainy}"; wcolor = Color(220, 220, 255); }
                else if (cond == "windy") { wicon = "${weather_icon_windy}"; wdesc = "${weather_text_windy}"; wcolor = Color(100, 200, 180); }
                else if (cond == "windy-variant") { wicon = "${weather_icon_windy_variant}"; wdesc = "${weather_text_windy_variant}"; wcolor = Color(100, 200, 180); }
                else if (cond == "exceptional") { wicon = "${weather_icon_exceptional}"; wdesc = "${weather_text_exceptional}"; wcolor = Color(230, 80, 80); }

                it.print(120 + ox, 86 + oy, id(weather_icon_font), wcolor, TextAlign::TOP_CENTER, wicon);
                it.print(120 + ox, 148 + oy, id(main_font), Color(200, 200, 200), TextAlign::TOP_CENTER, wdesc.c_str());
                if (!std::isnan(id(weather_temperature).state)) {
                  it.printf(120 + ox, 172 + oy, id(clock_font_large), wcolor, TextAlign::TOP_CENTER, "%.1f°", id(weather_temperature).state);
                } else {
                  it.print(120 + ox, 172 + oy, id(clock_font_large), Color(90, 90, 90), TextAlign::TOP_CENTER, "--");
                }

          # --- PAGE 1: generic 2x2 grid (icon + primary + secondary per entry) ---
          - id: page1
            lambda: |-
                it.fill(Color(0, 0, 0));
                int ox = id(offset_x);
                int oy = id(offset_y);

                GridEntry entries[4];
                entries[0] = { "${page1_entry1_icon}",
                               entry_value("${page1_entry1_primary_label}", id(p1e1_primary).state, "${page1_entry1_primary_unit}"),
                               entry_value("${page1_entry1_secondary_label}", id(p1e1_secondary).state, "${page1_entry1_secondary_unit}") };
                entries[1] = { "${page1_entry2_icon}",
                               entry_value("${page1_entry2_primary_label}", id(p1e2_primary).state, "${page1_entry2_primary_unit}"),
                               entry_value("${page1_entry2_secondary_label}", id(p1e2_secondary).state, "${page1_entry2_secondary_unit}") };
                entries[2] = { "${page1_entry3_icon}",
                               entry_value("${page1_entry3_primary_label}", id(p1e3_primary).state, "${page1_entry3_primary_unit}"),
                               entry_value("${page1_entry3_secondary_label}", id(p1e3_secondary).state, "${page1_entry3_secondary_unit}") };
                entries[3] = { "${page1_entry4_icon}",
                               entry_value("${page1_entry4_primary_label}", id(p1e4_primary).state, "${page1_entry4_primary_unit}"),
                               entry_value("${page1_entry4_secondary_label}", id(p1e4_secondary).state, "${page1_entry4_secondary_unit}") };

                draw_entry_grid(it, id(big_icon_font_p1e1), id(big_icon_font_p1e2), id(big_icon_font_p1e3), id(big_icon_font_p1e4),
                                 id(value_font_medium), id(stat_font_small), entries,
                                 Color(0, 220, 255), Color(150, 150, 150), ox, oy);

          # --- PAGE 2: generic 2x2 grid ---
          - id: page2
            lambda: |-
                it.fill(Color(0, 0, 0));
                int ox = id(offset_x);
                int oy = id(offset_y);

                GridEntry entries[4];
                entries[0] = { "${page2_entry1_icon}",
                               entry_value("${page2_entry1_primary_label}", id(p2e1_primary).state, "${page2_entry1_primary_unit}"),
                               entry_value("${page2_entry1_secondary_label}", id(p2e1_secondary).state, "${page2_entry1_secondary_unit}") };
                entries[1] = { "${page2_entry2_icon}",
                               entry_value("${page2_entry2_primary_label}", id(p2e2_primary).state, "${page2_entry2_primary_unit}"),
                               entry_value("${page2_entry2_secondary_label}", id(p2e2_secondary).state, "${page2_entry2_secondary_unit}") };
                entries[2] = { "${page2_entry3_icon}",
                               entry_value("${page2_entry3_primary_label}", id(p2e3_primary).state, "${page2_entry3_primary_unit}"),
                               entry_value("${page2_entry3_secondary_label}", id(p2e3_secondary).state, "${page2_entry3_secondary_unit}") };
                entries[3] = { "${page2_entry4_icon}",
                               entry_value("${page2_entry4_primary_label}", id(p2e4_primary).state, "${page2_entry4_primary_unit}"),
                               entry_value("${page2_entry4_secondary_label}", id(p2e4_secondary).state, "${page2_entry4_secondary_unit}") };

                draw_entry_grid(it, id(big_icon_font_p2e1), id(big_icon_font_p2e2), id(big_icon_font_p2e3), id(big_icon_font_p2e4),
                                 id(value_font_medium), id(stat_font_small), entries,
                                 Color(0, 220, 255), Color(150, 150, 150), ox, oy);

          # --- PAGE ALARM: big icon + current state name, small "last transition" footer ---
          - id: page_alarm
            lambda: |-
                it.fill(Color(0, 0, 0));
                int ox = id(offset_x);
                int oy = id(offset_y);

                static const char *const alarm_names[10] = {
                  "${alarm_text_disarmed}", "${alarm_text_armed_home}", "${alarm_text_armed_away}",
                  "${alarm_text_armed_night}", "${alarm_text_armed_vacation}", "${alarm_text_armed_bypass}",
                  "${alarm_text_pending}", "${alarm_text_arming}", "${alarm_text_disarming}", "${alarm_text_triggered}"
                };
                static const char *const alarm_icons[10] = {
                  "${alarm_icon_disarmed}", "${alarm_icon_armed_home}", "${alarm_icon_armed_away}",
                  "${alarm_icon_armed_night}", "${alarm_icon_armed_vacation}", "${alarm_icon_armed_bypass}",
                  "${alarm_icon_pending}", "${alarm_icon_arming}", "${alarm_icon_disarming}", "${alarm_icon_triggered}"
                };

                std::string state = id(alarm_state).state;
                int state_idx = alarm_state_index(state);
                std::string aname = alarm_names[state_idx];
                const char *aicon = alarm_icons[state_idx];
                Color acolor = Color(40, 220, 130); // default = disarmed

                if (state.rfind("armed_", 0) == 0) acolor = Color(80, 150, 255);
                else if (state == "pending" || state == "arming" || state == "disarming") acolor = Color(240, 170, 70);
                else if (state == "triggered") acolor = Color(230, 60, 60);

                it.print(120 + ox, 20 + oy, id(status_icon_font), acolor, TextAlign::TOP_CENTER, aicon);
                it.print(120 + ox, 124 + oy, id(value_font_medium), acolor, TextAlign::TOP_CENTER, aname.c_str());

                if (state == "triggered") {
                  // Alarmo (and similar integrations) populate "open_sensors" with whatever
                  // caused the trigger while it's active - best effort, since HA sends this
                  // attribute as its raw string form, not a nicely formatted list.
                  std::string cause = id(alarm_open_sensors).state;
                  bool has_cause = !cause.empty() && cause != "None" && cause != "none";
                  it.line(10 + ox, 158 + oy, 230 + ox, 158 + oy, Color(50, 50, 50));
                  if (has_cause) {
                    if (cause.length() > 24) cause = cause.substr(0, 24) + "..";
                    std::string line = "${alarm_text_cause_prefix}" + cause;
                    it.print(120 + ox, 170 + oy, id(stat_font_small), Color(230, 60, 60), TextAlign::TOP_CENTER, line.c_str());
                  } else {
                    it.print(120 + ox, 170 + oy, id(stat_font_small), Color(120, 120, 120), TextAlign::TOP_CENTER, "${alarm_text_cause_unknown}");
                  }
                } else if (!id(alarm_prev_name).empty()) {
                  // Last transition: "Anterior -> Atual" plus who/when it happened.
                  it.line(10 + ox, 158 + oy, 230 + ox, 158 + oy, Color(50, 50, 50));

                  std::string transition = id(alarm_prev_name) + " -> " + aname;
                  if (transition.length() > 30) transition = transition.substr(0, 30) + "..";
                  it.print(120 + ox, 168 + oy, id(stat_font_small), Color(150, 150, 150), TextAlign::TOP_CENTER, transition.c_str());

                  std::string who = id(alarm_changed_by).state;
                  std::string when = id(alarm_transition_time);
                  std::string line2 = (!who.empty() && who != "None") ? who + "@" + when : when;
                  if (!line2.empty()) {
                    it.print(120 + ox, 192 + oy, id(stat_font_small), Color(120, 120, 120), TextAlign::TOP_CENTER, line2.c_str());
                  }
                }

          # --- PAGE LIGHTS: big bulb icon + which lights are on, or "all off" ---
          - id: page_lights
            lambda: |-
                it.fill(Color(0, 0, 0));
                int ox = id(offset_x);
                int oy = id(offset_y);

                float count = id(lights_count).state;
                bool has_light = !std::isnan(count) && count > 0.5f;
                const char *licon = has_light ? "${lights_icon_on}" : "${lights_icon_off}";
                Color lcolor = has_light ? Color(255, 196, 0) : Color(110, 110, 110);

                if (!has_light) {
                  // Only 2 elements to show - center them as a block in the middle of the screen.
                  it.print(120 + ox, 56 + oy, id(status_icon_font), lcolor, TextAlign::TOP_CENTER, licon);
                  it.print(120 + ox, 160 + oy, id(value_font_medium), lcolor, TextAlign::TOP_CENTER, "${lights_text_all_off}");
                } else {
                  it.print(120 + ox, 20 + oy, id(status_icon_font), lcolor, TextAlign::TOP_CENTER, licon);

                  int n = (int) (count + 0.5f);
                  std::string headline = n == 1 ? "${lights_text_one_on}" : std::to_string(n) + " ${lights_text_on_suffix}";
                  it.print(120 + ox, 124 + oy, id(value_font_medium), lcolor, TextAlign::TOP_CENTER, headline.c_str());

                  it.line(10 + ox, 158 + oy, 230 + ox, 158 + oy, Color(50, 50, 50));

                  // HA sends the "entity_name" attribute (a list) as its raw string form, e.g.
                  // "['Candeeiro Secretaria Nuno']" - strip the list/quote punctuation so it
                  // reads as a plain comma-separated list instead.
                  std::string names = id(lights_names).state;
                  std::string clean;
                  for (char c : names) {
                    if (c != '[' && c != ']' && c != '\'') clean += c;
                  }
                  if (clean.length() > 34) clean = clean.substr(0, 34) + "..";
                  if (!clean.empty()) {
                    it.print(120 + ox, 170 + oy, id(stat_font_small), Color(200, 200, 200), TextAlign::TOP_CENTER, clean.c_str());
                  }
                }

time:
    - platform: homeassistant
      id: sntp_time

text_sensor:
    - platform: homeassistant
      id: weather_condition
      entity_id: ${weather_entity_id}
      internal: true

    # --- Alarm ---
    - platform: homeassistant
      id: alarm_state
      entity_id: ${alarm_entity_id}
      internal: true
      on_value:
          then:
              - lambda: |-
                    static const char *const alarm_names[10] = {
                      "${alarm_text_disarmed}", "${alarm_text_armed_home}", "${alarm_text_armed_away}",
                      "${alarm_text_armed_night}", "${alarm_text_armed_vacation}", "${alarm_text_armed_bypass}",
                      "${alarm_text_pending}", "${alarm_text_arming}", "${alarm_text_disarming}", "${alarm_text_triggered}"
                    };
                    std::string new_state = x;
                    if (!id(alarm_initialized)) {
                      // First state seen after boot - just establish the baseline, don't fabricate
                      // a transition out of nothing.
                      id(alarm_initialized) = true;
                    } else if (new_state != id(alarm_last_raw_state)) {
                      id(alarm_prev_name) = alarm_names[alarm_state_index(id(alarm_last_raw_state))];
                      auto t = id(sntp_time).now();
                      if (t.is_valid()) {
                        char buf[16];
                        snprintf(buf, sizeof(buf), "%02d/%02d %02d:%02d", t.day_of_month, t.month, t.hour, t.minute);
                        id(alarm_transition_time) = std::string(buf);
                      }
                    }
                    id(alarm_last_raw_state) = new_state;
    - platform: homeassistant
      id: alarm_changed_by
      entity_id: ${alarm_entity_id}
      attribute: changed_by
      internal: true
    - platform: homeassistant
      id: alarm_open_sensors
