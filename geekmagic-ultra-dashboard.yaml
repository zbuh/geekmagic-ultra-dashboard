# --- Fonts (Optimized for RAM) ---
# The generic entry values/labels are free-form user text, so the value/label fonts need a full
# alphanumeric glyph set (not just digits) to be able to render arbitrary units/labels.
font:
    - file: "gfonts://Ubuntu"
      id: clock_font_large
      size: 48
      glyphs: "0123456789:.-°"
    - file: "gfonts://Ubuntu"
      id: main_font
      size: 20
      glyphs: "0123456789. °,%abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:-/$|+"
    - file: "gfonts://Ubuntu"
      id: stat_font_small
      size: 18
      # ">" and "@" are needed for the alarm page's "Anterior -> Atual" / "quem@quando" lines.
      glyphs: "0123456789. °,%abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:-/$|+>@"
    - file: "gfonts://Ubuntu"
      id: value_font_medium
      size: 30
      glyphs: "0123456789. °,%abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:-/$|+"
    # One font resource PER generic-grid icon slot (8 total: page1 entries 1-4, page2 entries
    # 1-4), each embedding only its own page*_entry*_icon substitution. ESPHome's font component
    # rejects a font whose glyph list contains the same character twice - if all 8 icons shared
    # one font resource (as they used to), pasting the same icon into two different entries (e.g.
    # reusing one "forecast" icon across page2's 3 forecast tiles, a perfectly normal thing to do)
    # would fail to compile. Splitting into 8 single-icon fonts sidesteps that entirely, since the
    # duplicate check only looks within a single font's own glyph list.
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p1e1
      size: 40
      glyphs: "${page1_entry1_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p1e2
      size: 40
      glyphs: "${page1_entry2_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p1e3
      size: 40
      glyphs: "${page1_entry3_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p1e4
      size: 40
      glyphs: "${page1_entry4_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p2e1
      size: 40
      glyphs: "${page2_entry1_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p2e2
      size: 40
      glyphs: "${page2_entry2_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p2e3
      size: 40
      glyphs: "${page2_entry3_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: big_icon_font_p2e4
      size: 40
      glyphs: "${page2_entry4_icon}"
    - file: "gfonts://Material Symbols Outlined"
      id: weather_icon_font
      size: 56
      # Automatically embeds whichever glyphs you pasted into the weather_icon_* substitutions.
      glyphs: "${weather_icon_sunny}${weather_icon_clear_night}${weather_icon_partlycloudy}${weather_icon_cloudy}${weather_icon_fog}${weather_icon_rainy}${weather_icon_pouring}${weather_icon_lightning}${weather_icon_lightning_rainy}${weather_icon_hail}${weather_icon_snowy}${weather_icon_snowy_rainy}${weather_icon_windy}${weather_icon_windy_variant}${weather_icon_exceptional}"
    - file: "gfonts://Material Symbols Outlined"
      id: status_icon_font
      size: 96
      # Big "hero" icon shared by the alarm and lights pages - both are single-state status
      # pages that should read at a glance, so the icon dominates the layout.
      # Only the 4 base family glyphs are listed here - the per-state alarm_icon_* overrides
      # above default to reusing one of these, so they're already covered. If you override one
      # of them to a genuinely different glyph, add that glyph to this list too (a glyph listed
      # twice makes ESPHome fail with "Found duplicate glyphs").
      glyphs: "${alarm_icon_disarmed}${alarm_icon_armed}${alarm_icon_pending}${alarm_icon_triggered}${lights_icon_on}${lights_icon_off}"

# --- Page rotation + burn-in pixel shift ---
# Rotation order is fixed (main -> page1 -> page2 -> alarm -> lights -> main, ...); which pages
# actually take part and how long each stays on screen is controlled live from HA via the
# "Display Page ..." switches and the "Display Rotation Interval" number above.
interval:
    - interval: 1s
      then:
          - lambda: |-
                id(rotation_elapsed) += 1;
                if (id(rotation_elapsed) < (int) id(rotation_interval).state) {
                  return;
                }
                id(rotation_elapsed) = 0;

                auto *current = id(disp).get_active_page();
                int idx = 0;
                if (current == id(page_main)) idx = 0;
                else if (current == id(page1)) idx = 1;
                else if (current == id(page2)) idx = 2;
                else if (current == id(page_alarm)) idx = 3;
                else if (current == id(page_lights)) idx = 4;

                bool enabled[5] = { id(page_main_enable).state, id(page1_enable).state, id(page2_enable).state,
                                     id(page_alarm_enable).state, id(page_lights_enable).state };

                for (int step = 1; step <= 5; step++) {
                  int next = (idx + step) % 5;
                  if (enabled[next]) {
                    switch (next) {
                      case 0: id(disp).show_page(id(page_main)); break;
                      case 1: id(disp).show_page(id(page1)); break;
                      case 2: id(disp).show_page(id(page2)); break;
                      case 3: id(disp).show_page(id(page_alarm)); break;
                      case 4: id(disp).show_page(id(page_lights)); break;
                    }
                    break;
                  }
                }
          - component.update: disp

    # Burn-in / image-persistence mitigation (same idea as the LVGL cookbook recipe:
    # https://esphome.io/cookbook/lvgl/#prevent-burn-in-of-lcd), adapted for the plain
    # display component - the whole dashboard drifts by a couple of pixels every minute.
    # Toggle live from HA with the "Display Pixel Shift" switch.
    - interval: 60s
      then:
          - lambda: |-
                if (id(pixel_shift_enable).state) {
                  id(offset_x) = (id(offset_x) + 1) % 3;
                  id(offset_y) = (id(offset_y) + 1) % 2;
                }
          - component.update: disp
