name: ESPHome validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Fake secrets.yaml (WiFi creds aren't needed just to build)
        run: cp secrets.yaml.example secrets.yaml

      - name: Validate config
        run: esphome config geekmagic-ultra-dashboard.yaml

      - name: Compile firmware
        run: esphome compile geekmagic-ultra-dashboard.yaml
